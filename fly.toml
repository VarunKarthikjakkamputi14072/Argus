# Fly.io deployment for Argus.
#
# Argus is a multi-process app: a FastAPI web server, Celery workers, and a beat
# scheduler — all from the SAME image, separated here as Fly "process groups".
# Redis and PostgreSQL are NOT defined here; they are provisioned as managed
# Fly resources and wired in via secrets (see the "Deploying to Fly.io" section
# of README.md).
#
# Rename `app` to something globally unique before your first `fly deploy`.

app = "argus-pipeline"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# Non-secret defaults. Secrets (DATABASE_URL, SYNC_DATABASE_URL, REDIS_URL,
# CELERY_BROKER_URL, CELERY_RESULT_BACKEND, LLM_API_KEY) are set with
# `fly secrets set ...` and override/augment these at runtime.
[env]
  LLM_API_URL = "https://api.openai.com/v1/chat/completions"
  LLM_MODEL = "gpt-4o-mini"
  CELERY_WORKER_SHUTDOWN_TIMEOUT = "110"

# Three process groups, one image. Each overrides the Dockerfile CMD.
[processes]
  web = "uvicorn backend.main:app --host 0.0.0.0 --port 8000"
  worker = "celery -A backend.celery_app worker --loglevel=info --concurrency=4 -Q scraping,processing -n worker@%h --without-gossip --without-mingle --max-tasks-per-child=200"
  beat = "celery -A backend.celery_app beat --loglevel=info"

# Only the web process is exposed over HTTP.
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

# Health check hits the stats endpoint so a machine only stays in rotation
# once the DB connection and app are actually up.
[[http_service.checks]]
  method = "get"
  path = "/api/stats"
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"

# The web tier is light; workers do the heavy lifting.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["web", "beat"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "1024mb"
  processes = ["worker"]
